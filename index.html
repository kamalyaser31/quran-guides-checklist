<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>قائمة فنيات الحصة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@400;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.5"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#F6F8F7', ink: '#16302D', mushaf: '#0E5B55', mushafdark: '#0A4440',
            ochre: '#8A5A12', rule: '#D3DDDA', muted: '#4B5C59', wash: '#E4EEEB',
          },
          fontFamily: { body: ['"Markazi Text"', 'serif'], kufi: ['"Reem Kufi"', 'sans-serif'] },
        },
      },
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    :focus-visible { outline: 3px solid #8A5A12; outline-offset: 3px; }
    input[type=checkbox] { accent-color: #0E5B55; }
    li.item:has(input:checked) { background: #E4EEEB; }
    .bar-fill { transition: width 600ms ease-out; }
    @media (prefers-reduced-motion: reduce) { .bar-fill { transition: none; } }
  </style>
</head>
<body class="bg-paper text-ink font-body text-xl leading-loose">
  <main class="max-w-2xl mx-auto px-4 pt-10 pb-32" x-data="checklistApp()" x-init="load()">
    <header class="mb-8">
      <h1 class="font-kufi text-3xl sm:text-4xl font-bold text-mushafdark leading-snug">قائمة فنيات الحصة الاحترافية</h1>
      <p class="mt-3 text-muted">علِّم على ما استوفيته في حصتك، ثم اضغط «عرض التقييم». النسبة على البنود الأساسية وحدها.</p>
      <a href="#submit-button" class="inline-block mt-2 text-lg text-mushaf underline underline-offset-4">انتقل إلى زر عرض التقييم</a>
    </header>

    <p x-show="loading">جارٍ تحميل القائمة…</p>
    <p x-show="error" x-cloak role="alert" class="p-4 border-r-4 border-red-800 bg-white text-red-900" x-text="error"></p>

    <form x-show="!loading && !error" x-cloak @submit.prevent="showResult()">
      <fieldset class="mb-10">
        <legend class="text-xl font-semibold text-muted mb-3">نوع الحصة</legend>
        <div class="grid grid-cols-2 gap-2 p-1 bg-wash rounded-xl">
          <label class="block">
            <input type="radio" name="session-type" value="lesson" x-model="sessionType" class="peer sr-only">
            <span class="block text-center py-2 px-3 rounded-lg cursor-pointer peer-checked:bg-mushaf peer-checked:text-white peer-checked:font-semibold peer-focus-visible:outline peer-focus-visible:outline-[3px] peer-focus-visible:outline-ochre peer-focus-visible:outline-offset-2">درس تجويد</span>
          </label>
          <label class="block">
            <input type="radio" name="session-type" value="review" x-model="sessionType" class="peer sr-only">
            <span class="block text-center py-2 px-3 rounded-lg cursor-pointer peer-checked:bg-mushaf peer-checked:text-white peer-checked:font-semibold peer-focus-visible:outline peer-focus-visible:outline-[3px] peer-focus-visible:outline-ochre peer-focus-visible:outline-offset-2">حصة تسميع ومراجعة</span>
          </label>
        </div>
      </fieldset>

      <template x-for="section in visibleSections" :key="section.code">
        <section class="mb-14" :aria-labelledby="'heading-' + section.code">
          <div class="flex items-baseline gap-4 mb-5 pb-3 border-b-2 border-mushaf">
            <span class="font-kufi text-5xl font-bold text-mushaf leading-none" aria-hidden="true" x-text="section.number"></span>
            <h2 class="font-kufi text-2xl font-bold text-mushafdark leading-snug" :id="'heading-' + section.code">
              <span class="sr-only" x-text="'القسم ' + section.number + ': '"></span><span x-text="section.title"></span>
            </h2>
          </div>
          <template x-for="group in section.groups" :key="section.code + group.title">
            <div class="mb-6">
              <h3 x-show="group.title" class="font-kufi text-lg font-medium text-mushaf mb-2" x-text="group.title"></h3>
              <ul>
                <template x-for="item in group.items" :key="item.id">
                  <li class="item flex items-start gap-4 py-3 px-3 -mx-3 rounded-lg" :data-core="item.core">
                    <input type="checkbox" class="mt-2 w-6 h-6 shrink-0 cursor-pointer"
                      :id="'item-' + item.id" :value="item.id" x-model="checked"
                      :aria-describedby="'hint-' + item.id">
                    <div>
                      <label :for="'item-' + item.id" class="cursor-pointer">
                        <span x-text="item.text"></span>
                        <span class="whitespace-nowrap text-base font-semibold ms-1" :class="item.core ? 'text-ochre' : 'text-muted'" x-text="item.core ? '(أساسي)' : '(عند الحاجة)'"></span>
                      </label>
                      <p class="text-lg text-muted leading-relaxed" :id="'hint-' + item.id">
                        <span x-text="item.id + '. '"></span><span x-text="describe(item)"></span>
                      </p>
                    </div>
                  </li>
                </template>
              </ul>
            </div>
          </template>
        </section>
      </template>

      <div class="fixed inset-x-0 bottom-0 bg-paper/95 border-t border-rule">
        <div class="max-w-2xl mx-auto px-4 py-3 flex gap-3">
          <button id="submit-button" type="submit" class="flex-1 py-3 bg-mushaf hover:bg-mushafdark text-white text-2xl font-semibold rounded-xl">عرض التقييم</button>
          <button type="button" @click="reset()" class="px-5 py-3 border-2 border-mushaf text-mushafdark text-2xl font-semibold rounded-xl">تقييم جديد</button>
        </div>
      </div>
    </form>

    <section x-show="result" x-cloak x-ref="result" tabindex="-1" aria-labelledby="result-heading" class="mt-4 pt-6 border-t-4 border-mushaf">
      <template x-if="result">
        <div>
          <h2 id="result-heading" class="flex flex-wrap items-baseline gap-x-4">
            <span class="sr-only">التقييم: </span>
            <span class="font-kufi text-7xl font-bold text-mushaf leading-none" x-text="result.percent + '٪'"></span>
            <span class="font-kufi text-2xl font-bold text-mushafdark" x-text="result.grade"></span>
          </h2>
          <p class="mt-4" x-text="'استوفيت ' + result.coreDone + ' من ' + result.coreTotal + ' بنداً أساسياً، و' + result.optionalDone + ' من بنود «عند الحاجة».'"></p>
          <h3 class="font-kufi text-lg font-medium text-mushaf mt-8 mb-3">حسب القسم</h3>
          <ul class="space-y-4">
            <template x-for="row in result.sections" :key="row.code">
              <li>
                <span x-text="row.title + ': ' + row.done + ' من ' + row.total + ' (' + row.percent + '٪)'"></span>
                <span class="block h-2 mt-1 bg-wash rounded-full overflow-hidden" aria-hidden="true">
                  <span class="bar-fill block h-full bg-mushaf rounded-full" :style="'width:' + row.percent + '%'"></span>
                </span>
              </li>
            </template>
          </ul>
          <h3 class="font-kufi text-lg font-medium text-mushaf mt-8 mb-3">بنود أساسية فاتتك</h3>
          <p x-show="result.missed.length === 0">لم يفتك بند أساسي.</p>
          <ul x-show="result.missed.length > 0" class="space-y-2 list-disc pr-6 marker:text-ochre">
            <template x-for="item in result.missed" :key="item.id">
              <li x-text="item.id + '. ' + item.text"></li>
            </template>
          </ul>
        </div>
      </template>
    </section>
  </main>

  <script>
    // Section numbers each session type is assessed on, as stated in checklist.md.
    const SESSION_SECTIONS = { lesson: [1, 2, 3, 4, 6, 7], review: [1, 5, 6, 7] };

    const SECTION_RE = /^## (\d+)\. (.+?) \(([A-Z])\)\s*$/u;
    const OTHER_SECTION_RE = /^## /u;
    const SUBSECTION_RE = /^### \d+\.\d+ (.+?)\s*$/u;
    const ITEM_RE = /^- \[ \] \*\*([A-Z]\d+)\.\*\* (.+?) \*\((.+?)\)\*\s*$/u;
    const HINT_RE = /^\s+- تلميح: (.+?)\s*$/u;

    function clean(text) {
      return text.replace(/[\u0000-\u0008\u000b-\u001f\u007f]/gu, '').replace(/\s+/gu, ' ').trim();
    }

    function parseChecklist(markdown) {
      const sections = [];
      let section = null;
      let item = null;
      for (const line of markdown.replace(/^﻿/u, '').split(/\r?\n/u)) {
        let match = line.match(SECTION_RE);
        if (match) {
          section = { number: Number(match[1]), title: clean(match[2]), code: match[3], groups: [{ title: '', items: [] }] };
          sections.push(section);
          item = null;
          continue;
        }
        if (OTHER_SECTION_RE.test(line)) { section = null; item = null; continue; }
        if (!section) continue;
        match = line.match(SUBSECTION_RE);
        if (match) {
          section.groups.push({ title: clean(match[1]), items: [] });
          item = null;
          continue;
        }
        match = line.match(ITEM_RE);
        if (match) {
          const tags = match[3].split('،').map(clean);
          item = { id: match[1], text: clean(match[2]), core: tags[0] === 'أساسي', sources: tags.slice(1), hint: '' };
          section.groups[section.groups.length - 1].items.push(item);
          continue;
        }
        match = line.match(HINT_RE);
        if (match && item) item.hint = clean(match[1]);
      }
      for (const s of sections) {
        s.groups = s.groups.filter((g) => g.items.length > 0);
        // Core items lead each list; the stable sort keeps the file order within each kind.
        for (const g of s.groups) g.items.sort((a, b) => Number(b.core) - Number(a.core));
      }
      return sections;
    }

    function sourceLabel(code) {
      if (/^م\d+$/u.test(code)) return 'المحاضرة ' + code.slice(1);
      if (code === 'Oct') return 'محاضرة Octalysis';
      if (code === 'إضافة') return 'إضافة من خارج المحاضرات';
      return code;
    }

    function gradeFor(percent) {
      if (percent >= 90) return 'ممتاز';
      if (percent >= 80) return 'جيد جداً';
      if (percent >= 65) return 'جيد';
      if (percent >= 50) return 'مقبول';
      return 'يحتاج إلى تحسين';
    }

    function checklistApp() {
      return {
        loading: true,
        error: '',
        sections: [],
        sessionType: 'lesson',
        checked: [],
        result: null,

        async load() {
          try {
            const response = await fetch('checklist.md', { cache: 'no-cache' });
            if (!response.ok) throw new Error(response.status);
            this.sections = parseChecklist(await response.text());
            if (this.sections.length === 0) throw new Error('empty');
          } catch (e) {
            this.error = 'تعذّر تحميل ملف القائمة checklist.md. افتح الصفحة من GitHub Pages أو من خادم محلي، لا من الملف مباشرة.';
          } finally {
            this.loading = false;
          }
          this.$watch('checked', () => { this.result = null; });
          this.$watch('sessionType', () => { this.result = null; });
        },

        get visibleSections() {
          const numbers = SESSION_SECTIONS[this.sessionType];
          return this.sections.filter((s) => numbers.includes(s.number));
        },

        describe(item) {
          const source = 'المصدر: ' + item.sources.map(sourceLabel).join('، ') + '.';
          return item.hint ? item.hint + ' ' + source : source;
        },

        showResult() {
          const done = new Set(this.checked);
          let coreDone = 0, coreTotal = 0, optionalDone = 0;
          const rows = [], missed = [];
          for (const section of this.visibleSections) {
            const items = section.groups.flatMap((g) => g.items);
            const core = items.filter((i) => i.core);
            const sectionDone = core.filter((i) => done.has(i.id)).length;
            coreDone += sectionDone;
            coreTotal += core.length;
            optionalDone += items.filter((i) => !i.core && done.has(i.id)).length;
            missed.push(...core.filter((i) => !done.has(i.id)));
            rows.push({
              code: section.code, title: section.title, done: sectionDone, total: core.length,
              percent: core.length ? Math.round((sectionDone / core.length) * 100) : 100,
            });
          }
          const percent = coreTotal ? Math.round((coreDone / coreTotal) * 100) : 0;
          this.result = { percent, grade: gradeFor(percent), coreDone, coreTotal, optionalDone, sections: rows, missed };
          this.$nextTick(() => this.$refs.result.focus());
        },

        reset() {
          if (!window.confirm('هل تمسح كل العلامات وتبدأ تقييماً جديداً؟')) return;
          this.checked = [];
          this.result = null;
          this.$nextTick(() => document.querySelector('input[name="session-type"]:checked').focus());
        },
      };
    }
  </script>
</body>
</html>
